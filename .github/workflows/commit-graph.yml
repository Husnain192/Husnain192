name: Update commit graph
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_commits.py
      - .github/workflows/commit-graph.yml
permissions:
  contents: write
concurrency:
  group: commit-graph
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate commit SVG
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python3 scripts/update_commits.py
      - name: Commit updated graph
        run: |
          git add assets/commits.svg assets/commits.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update commit graph"
          git pull --rebase origin main
          git push origin HEAD:main
